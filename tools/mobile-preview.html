<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>혜화의 봄 — 기기 미리보기</title>
<!-- 개발용: 데스크톱 브라우저에서 iPhone 화면 크기로 게임을 확인하는 페이지 -->
<style>
  html,body{margin:0;background:#141018;color:#eee;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
  .wrap{display:flex;gap:40px;padding:34px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .dev{display:flex;flex-direction:column;gap:10px;align-items:center}
  .dev > span{font-size:12px;color:#9b93a5;letter-spacing:.12em}
  .phone{border:10px solid #241d2b;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;background:#000}
  iframe{border:0;display:block;background:#120c16}
</style>
</head>
<body>
<div class="wrap">
  <div class="dev">
    <span>iPhone 13 · 390 × 844</span>
    <div class="phone"><iframe src="../index.html?v=10" width="390" height="844" title="iPhone 13"></iframe></div>
  </div>
  <div class="dev">
    <span>iPhone 14 Pro Max · 430 × 932</span>
    <div class="phone"><iframe src="../index.html?v=10" width="430" height="932" title="iPhone 14 Pro Max"></iframe></div>
  </div>
</div>
</body>
</html>
